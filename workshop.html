<script>
/* Alias of free-workshop.html (this URL was shared on LinkedIn). Static hosting has
   no 301, so redirect at once and keep ?lang, UTMs and #hash. When there is no
   utm_source, pass the original referrer host as ?ref so ai-tracker.js keeps the source. */
(function () {
  var p = new URLSearchParams(location.search);
  if (!p.get('utm_source') && document.referrer) {
    try {
      var h = new URL(document.referrer).hostname.replace(/^www\./, '');
      if (h && h !== location.hostname.replace(/^www\./, '')) p.set('ref', h);
    } catch (e) { }
  }
  p.set('alias', 'workshop');
  location.replace('free-workshop.html?' + p.toString() + location.hash);
})();
</script>
